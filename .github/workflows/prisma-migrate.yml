name: Build & Migrate

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check DB connectivity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD:"; pwd
          echo "Root listing:"; ls -la
          echo "Scripts dir listing:"; ls -la scripts || true
          echo "Installing dnsutils for diagnostics"
          sudo apt-get update && sudo apt-get install -y dnsutils || true
          echo "nslookup:"; nslookup $(node -e "console.log(new URL(process.env.DATABASE_URL).hostname)") || true
          echo "curl check (HEAD):"; curl -I --max-time 10 "https://$(node -e \"console.log(new URL(process.env.DATABASE_URL).hostname)\")" || true
          echo "Running check script..."
          node scripts/check-db-conn.js

      - name: Prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: npx prisma generate

      - name: Prisma migrate (create tables)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: npx prisma migrate deploy

      - name: Supabase CLI fallback (optional)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "No SUPABASE_SERVICE_ROLE_KEY provided — skipping Supabase CLI fallback"
            exit 0
          fi
          echo "Installing Supabase CLI..."
          curl -sL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz -C /usr/local/bin
          echo "Logging in to Supabase CLI using service role key"
          supabase login --service-role-key "$SUPABASE_SERVICE_ROLE_KEY" || true
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "No SUPABASE_PROJECT_REF provided — cannot run db push. Provide secret SUPABASE_PROJECT_REF or skip."
            exit 0
          fi
          echo "Running supabase db push --project-ref $SUPABASE_PROJECT_REF"
          supabase db push --project-ref "$SUPABASE_PROJECT_REF"

      - name: Build project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run build
